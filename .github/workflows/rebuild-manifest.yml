name: Rebuild CTIS manifest

on:
  push:
    paths:
      - 'messages/**/*.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild manifest
        shell: python
        run: |
          import json
          from pathlib import Path

          paths = sorted(
              str(p).replace('\\', '/')
              for p in Path('messages').rglob('*.json')
              if p.is_file()
          ) if Path('messages').exists() else []

          Path('state').mkdir(parents=True, exist_ok=True)
          Path('state/manifest.json').write_text(
              json.dumps({
                  'schema': 'ctis-manifest/1.0',
                  'messages': paths
              }, indent=2) + '\n',
              encoding='utf-8'
          )

      - name: Commit manifest if changed
        run: |
          if git diff --quiet -- state/manifest.json; then
            echo "Manifest already current."
            exit 0
          fi
          git config user.name "ctis-manifest-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/manifest.json
          git commit -m "Update CTIS message manifest"
          git push
