name: Package Edge Extension

on:
  push:
    branches: [main]
    paths:
      - 'edge-extension/**'
      - '.github/workflows/package-edge-extension.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('edge-extension/manifest.json')
          data = json.loads(p.read_text())
          assert data['manifest_version'] == 3
          assert data['name']
          assert data['version']
          print('Manifest OK:', data['name'], data['version'])
          PY

      - name: Build Microsoft Edge submission ZIP
        run: |
          cd edge-extension
          zip -r ../ctis-existing-tab-bridge-edge.zip \
            manifest.json \
            background.js \
            model-content.js \
            ctis-content.js

      - name: Upload submission package
        uses: actions/upload-artifact@v4
        with:
          name: ctis-existing-tab-bridge-edge
          path: ctis-existing-tab-bridge-edge.zip
          if-no-files-found: error
